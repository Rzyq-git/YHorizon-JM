#
# Fallback for stock / xPack OpenOCD (no gd32f30x flash driver).
# GD32F303CCT6: Cortex-M4 TAP 0x2BA01477, 256 KB flash.
# Do not mass_erase: stm32f1x may still mis-size the part.
#

adapter driver cmsis-dap
transport select swd

set CHIPNAME gd32f303
set CPUTAPID 0x2ba01477
set FLASH_SIZE 0x40000
set WORKAREASIZE 0x1000

source [find target/stm32f1x.cfg]

adapter speed 500
reset_config none
